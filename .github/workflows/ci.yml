name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qualite:
    name: Lint, format, tests unitaires
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo?schema=public
      DIRECT_DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm test
      - run: npm run build

  integration:
    name: Cloisonnement multi-tenant (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onbo
          POSTGRES_PASSWORD: onbo
          POSTGRES_DB: onbo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onbo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo_test?schema=public
      DIRECT_DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo_test?schema=public
      TEST_DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test

  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onbo
          POSTGRES_PASSWORD: onbo
          POSTGRES_DB: onbo_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onbo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo_e2e?schema=public
      TEST_DATABASE_URL: postgresql://onbo:onbo@localhost:5432/onbo_e2e?schema=public
      APP_URL: http://127.0.0.1:3000
      UPLOAD_DIR: /tmp/onbo-uploads
      # Cle de test, jetable : la vraie vit dans les secrets du deploiement.
      ONBO_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: mkdir -p /tmp/onbo-uploads
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
