name: Deploy

# Declenchement manuel uniquement : il n'y a pas de VPS cible pour l'instant.
# Reactiver le declencheur sur push le jour ou un serveur existe a nouveau.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sans hote configure, le job s'arrete avant de tenter une connexion.
    if: vars.VPS_ENABLED == 'true'
    steps:
      - name: SSH deploy sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
