services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onbo}
      POSTGRES_DB: ${POSTGRES_DB:-onbo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onbo} -d ${POSTGRES_DB:-onbo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de ports: -> base interne au reseau Docker, non exposee.

  app:
    build:
      context: .
    restart: unless-stopped
    # Logs JSON, rotation locale : pas de disque plein sur un incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-onbo}:${POSTGRES_PASSWORD:-onbo}@db:5432/${POSTGRES_DB:-onbo}?schema=public
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Sous-domaine des portails clients, si configure (issue #30).
      PORTAL_URL: ${PORTAL_URL:-}
      UPLOAD_DIR: /app/uploads
      # Stockage objet UE (issue #32) : sans ces variables, volume disque.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-fr-par}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ANTIVIRUS_URL: ${ANTIVIRUS_URL:-}
      # Observabilite (issue #35)
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      APP_RELEASE: ${APP_RELEASE:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Durees de conservation (issue #45)
      RETENTION_PROJECT_MONTHS: ${RETENTION_PROJECT_MONTHS:-12}
      RETENTION_LOG_DAYS: ${RETENTION_LOG_DAYS:-365}
      RETENTION_EMAIL_DAYS: ${RETENTION_EMAIL_DAYS:-180}
      RETENTION_ABUSE_DAYS: ${RETENTION_ABUSE_DAYS:-90}
      # Facturation Stripe (issue #41)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SOLO: ${STRIPE_PRICE_SOLO:-}
      STRIPE_PRICE_STUDIO: ${STRIPE_PRICE_STUDIO:-}
      STRIPE_PRICE_AGENCE: ${STRIPE_PRICE_AGENCE:-}
      QUOTA_PROJECT_BYTES: ${QUOTA_PROJECT_BYTES:-}
      QUOTA_AGENCY_BYTES: ${QUOTA_AGENCY_BYTES:-}
      ONBO_ENCRYPTION_KEY: ${ONBO_ENCRYPTION_KEY:?cle de chiffrement manquante}
      # Rotation (issue #33) : trousseau "k0:...,k1:..." + cle d'ecriture.
      ONBO_ENCRYPTION_KEYS: ${ONBO_ENCRYPTION_KEYS:-}
      ONBO_ENCRYPTION_KEY_ID: ${ONBO_ENCRYPTION_KEY_ID:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Emails (issue #29) : console par defaut, sinon brevo/postmark/scaleway.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Onbo <onboarding@localhost>}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      POSTMARK_STREAM: ${POSTMARK_STREAM:-outbound}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY:-}
      SCALEWAY_PROJECT_ID: ${SCALEWAY_PROJECT_ID:-}
      SCALEWAY_REGION: ${SCALEWAY_REGION:-fr-par}
    volumes:
      - uploads:/app/uploads
    # Aucun port publie (issue #30) : tout passe par le proxy.
    expose:
      - "3000"

  # Terminaison TLS et certificats Let's Encrypt automatiques (issue #30).
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?domaine manquant}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portail.${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?adresse ACME manquante}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Declencheur des taches planifiees : relances (horaire) et file d'emails
  # (toutes les minutes, pour la reprise sur echec).
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
      tick=0;
      while true; do
        sleep 60;
        tick=$$((tick + 1));
        curl -s -X POST -H \"x-cron-secret: $$CRON_SECRET\" http://app:3000/api/cron/emails >/dev/null || true;
        if [ $$((tick % 60)) -eq 0 ]; then
          curl -s -X POST -H \"x-cron-secret: $$CRON_SECRET\" http://app:3000/api/cron/reminders >/dev/null || true;
        fi;
        if [ $$((tick % 1440)) -eq 0 ]; then
          curl -s -X POST -H \"x-cron-secret: $$CRON_SECRET\" http://app:3000/api/cron/digest >/dev/null || true;
          curl -s -X POST -H \"x-cron-secret: $$CRON_SECRET\" http://app:3000/api/cron/retention >/dev/null || true;
        fi;
      done"

  # Sauvegardes chiffrees quotidiennes (issue #31).
  #
  # Image postgres pour disposer de pg_dump et psql ; le script est celui du
  # depot, monte en lecture seule. Le stockage de destination est distinct du
  # serveur : une panne disque ne doit pas emporter les sauvegardes.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-onbo}:${POSTGRES_PASSWORD:-onbo}@db:5432/${POSTGRES_DB:-onbo}?schema=public
      UPLOAD_DIR: /app/uploads
      BACKUP_KEY: ${BACKUP_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-fr-par}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - uploads:/app/uploads:ro
      - ./scripts:/opt/onbo/scripts:ro
    command: >
      sh -c "apk add --no-cache nodejs >/dev/null &&
      while true; do
        node /opt/onbo/scripts/backup.mjs || true;
        sleep 86400;
      done"

  # Sonde externe (issue #35) : /api/health et le portail, toutes les 60 s.
  # Deux echecs consecutifs declenchent l'alerte, soit moins de 2 minutes.
  probe:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PROBE_URLS: ${PROBE_URLS:-http://app:3000/api/health}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
      fails=0;
      while true; do
        ok=1;
        for url in $$PROBE_URLS; do
          curl -fsS --max-time 10 \"$$url\" >/dev/null || ok=0;
        done;
        if [ $$ok -eq 1 ]; then
          fails=0;
        else
          fails=$$((fails + 1));
          if [ $$fails -eq 2 ] && [ -n \"$$ALERT_WEBHOOK_URL\" ]; then
            curl -fsS -X POST -H 'content-type: application/json' \
              -d '{\"text\":\"Onbo : sonde en echec, service indisponible\"}' \
              \"$$ALERT_WEBHOOK_URL\" >/dev/null || true;
          fi;
        fi;
        sleep 60;
      done"

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
