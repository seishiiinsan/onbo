services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onbo}
      POSTGRES_DB: ${POSTGRES_DB:-onbo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onbo} -d ${POSTGRES_DB:-onbo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de ports: -> base interne au reseau Docker, non exposee.

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-onbo}:${POSTGRES_PASSWORD:-onbo}@db:5432/${POSTGRES_DB:-onbo}?schema=public
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db_data:
